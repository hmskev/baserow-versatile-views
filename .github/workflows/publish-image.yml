name: Build and publish Docker image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BASEROW_VERSION=2.3.3
          tags: |
            ghcr.io/${{ github.repository_owner }}/baserow-versatile-views:0.1.0
            ghcr.io/${{ github.repository_owner }}/baserow-versatile-views:latest
